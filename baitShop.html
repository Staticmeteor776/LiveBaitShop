<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lakeside General Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="Styles/styles.css">
</head>

<body>
    <div class="container">
        <header class="tophead">
            <h1 class="h1">Our Products</h1>
        </header>
        <nav>
            <div class="container-fluid">
                <ul class="nav nav-underline justify-content-center">
                    <li class="nav-item">
                        <a class="nav-link " href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contactForm.html">Contact Us</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="baitShop.html">Products</a>
                    </li>
                </ul>
            </div>
        </nav>

        <div class="main container-fluid">
            <div id="carouselExampleIndicators" class="carousel slide" data-bs-theme="dark" >
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <div class="cards-wrapper">
                            <div class="card" style="width: 18rem;" >
                                <img src="Images/redWormBait.webp" class="card-img-top" alt="Red Worm Bait">
                                <div class="card-body">
                                    <h5 class="card-title">Red Worms</h5>
                                    <p class="card-text">$3.45/24 ct.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="carousel-item">
                        <div class="cards-wrapper">
                            <div class="card" style="width: 18rem;">
                                <img src="Images/nightCrawler.webp" class="card-img-top" alt="Night Crawler Bait">
                                <div class="card-body">
                                    <h5 class="card-title">Night Crawlers</h5>
                                    <p class="card-text">$2.80/12 ct.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="carousel-item">
                        <div class="cards-wrapper">
                            <div class="card" style="width: 18rem;">
                                <img src="Images/glowWorm.webp" class="card-img-top" alt="GlowWorms">
                                <div class="card-body">
                                    <h5 class="card-title">Glow Worms</h5>
                                    <p class="card-text">$3.25/12 ct.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="carousel-item">
                        <div class="cards-wrapper">
                            <div class="card" style="width: 18rem;">
                                <img src="Images/waxWorms.webp" class="card-img-top" alt="Wax Worms">
                                <div class="card-body">
                                    <h5 class="card-title">Wax Worms</h5>
                                    <p class="card-text">$2.80/50 ct.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="carousel-item ">
                        <div class="cards-wrapper">
                            <div class="card" style="width: 18rem;">
                                <img src="Images/leeches.jpg" class="card-img-top" alt="Leeches">
                                <div class="card-body">
                                    <h5 class="card-title">Leeches</h5>
                                    <p class="card-text">$4.00/12ct.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators"
                    data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators"
                    data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>

        </div>
    </div>
</body>

</html>
